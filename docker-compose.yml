services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cityai
      POSTGRES_USER: cityai
      POSTGRES_PASSWORD: cityai_dev_password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityai -d cityai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/cityai
      DB_USERNAME: cityai
      DB_PASSWORD: cityai_dev_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      DATA_DIR: /data
      EVIDENCE_DIR: /data/evidence
      INGEST_USERNAME: ingest
      INGEST_PASSWORD: change-me-in-production
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  ai-service:
    build: ./ai-service
    volumes:
      - ./videos:/app/videos:ro
      - ./data:/data
      - ai-models:/app/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db-data:
  ai-models:
