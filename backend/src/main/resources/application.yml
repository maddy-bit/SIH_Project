spring:
  application:
    name: city-ai-backend

  datasource:
    url: jdbc:h2:file:./data/city-ai-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Base URL of the Python AI microservice (vehicle detection, plate OCR,
# tracking). Not called yet in Phase 1 - wired up starting Phase 3.
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.cityai.backend: INFO
