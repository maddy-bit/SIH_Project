spring:
  application:
    name: city-ai-backend

  datasource:
    url: jdbc:h2:file:./data/city-ai-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Credentials for POST /api/detections/ingest (HTTP Basic) - see
# security/SecurityConfig.java for what is/isn't protected and why.
# CHANGE THESE before deploying anywhere but localhost.
ingest:
  username: ${INGEST_USERNAME:ingest}
  password: ${INGEST_PASSWORD:change-me-in-production}

# Base URL of the Python AI microservice (vehicle detection, plate OCR,
# tracking). The backend itself doesn't call it synchronously in the
# prototype - scripts/process_video.py drives the AI service and posts
# results to POST /api/detections/ingest.
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

# Seed data (cameras.json, vehicles.json) and evidence frames, relative to
# the backend module's working directory when run via `mvn spring-boot:run`.
app:
  data-dir: ${DATA_DIR:../data}
  evidence-dir: ${EVIDENCE_DIR:../data/evidence}

logging:
  level:
    com.cityai.backend: INFO
