spring:
  application:
    name: city-ai-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:cityaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Credentials for POST /api/detections/ingest (HTTP Basic)
ingest:
  username: ${INGEST_USERNAME:ingest}
  password: ${INGEST_PASSWORD:change-me-in-production}

# Base URL of the Python AI microservice (Live Render URL)
ai-service:
  base-url: ${AI_SERVICE_URL:https://city-ai-engine.onrender.com}

# Seed data and evidence frames
app:
  data-dir: ${DATA_DIR:../data}
  evidence-dir: ${EVIDENCE_DIR:../data/evidence}

logging:
  level:
    com.cityai.backend: INFO
