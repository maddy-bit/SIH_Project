name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test
      - name: mvn compile (fail on warnings)
        working-directory: backend
        run: mvn -B compile -Dmaven.compiler.showWarnings=true

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ai-service:
    name: AI service (Python - lint/syntax only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check every module
        working-directory: ai-service
        # Full model-download-and-run tests need ~5GB of torch/easyocr
        # weights and real video input - too slow/heavy for CI. This
        # catches syntax errors and import-time mistakes fast; the actual
        # AI pipeline is exercised via scripts/smoke_test.sh locally
        # against a running backend with the demo dataset ingested.
        run: python3 -m py_compile main.py schemas.py ai/*.py utils/*.py services/*.py

  smoke-test:
    name: API smoke test (backend + H2)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend package
        working-directory: backend
        run: mvn -B package -DskipTests
      - name: Start backend and run smoke tests
        working-directory: backend
        run: |
          java -jar target/backend-*.jar > backend.log 2>&1 &
          BACKEND_PID=$!
          trap "kill -9 $BACKEND_PID 2>/dev/null || true" EXIT

          echo "Waiting for backend to be ready on port 8080..."
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "Waiting for backend... (attempt $i/30)"
            sleep 2
          done

          if [ $READY -ne 1 ]; then
            echo "ERROR: Backend failed to start within 60s. Log output:"
            cat backend.log
            exit 1
          fi

          echo "Backend is healthy! Running smoke tests..."
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/api/cameras
          curl -sf http://localhost:8080/api/analytics/overview
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/vehicles/ZZ99ZZ9999)" = "404"
          echo "All smoke tests passed successfully!"
