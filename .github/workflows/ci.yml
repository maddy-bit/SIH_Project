name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test
      - name: mvn compile (fail on warnings)
        working-directory: backend
        run: mvn -B compile -Dmaven.compiler.showWarnings=true

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ai-service:
    name: AI service (Python - lint/syntax only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check every module
        working-directory: ai-service
        # Full model-download-and-run tests need ~5GB of torch/easyocr
        # weights and real video input - too slow/heavy for CI. This
        # catches syntax errors and import-time mistakes fast; the actual
        # AI pipeline is exercised via scripts/smoke_test.sh locally
        # against a running backend with the demo dataset ingested.
        run: python3 -m py_compile main.py schemas.py ai/*.py utils/*.py services/*.py

  smoke-test:
    name: API smoke test (backend + H2)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start backend
        working-directory: backend
        run: |
          mvn -B -q spring-boot:run &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 2
          done
      - name: Run smoke tests
        # Runs against an empty H2 database - only the always-present checks
        # (health, unknown-plate 404s, empty analytics) apply; the demo-data
        # assertions are skipped since nothing has been ingested in CI.
        run: |
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/api/cameras
          curl -sf http://localhost:8080/api/analytics/overview
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/vehicles/ZZ99ZZ9999)" = "404"
